[project]
name = "rfp-rag-modular"
version = "0.1.0"
description = "Haiku 4.5와 로컬 TF-IDF로 실행하는 최소 RAG 기준선"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
documents = ["pypdf>=5,<7", "olefile>=0.47,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rfp_rag*"]

[tool.rag]
package = "rfp_rag"
