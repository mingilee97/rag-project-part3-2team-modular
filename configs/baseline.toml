# 가장 단순한 유사도 검색과 한 번의 답변 생성을 연결한다.
[project]
name = "rfp-rag-modular"

[paths]
data_dir = "data/raw"
index_path = "data/index/baseline.json"

[chunking]
size = 800
overlap = 100

[retrieval]
top_k = 3

[models]
provider = "openai"
embedding = "text-embedding-3-small"
generation = "gpt-5-mini"

[generation]
max_output_tokens = 2048
